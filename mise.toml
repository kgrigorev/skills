# Tool versions for scripts/check, .githooks/pre-push and CI; mise.lock pins URLs and checksums.
# Agents: change only with owner approval, then run `MISE_LOCKED=0 mise lock`.
min_version = "2026.11.8"

[settings]
lockfile = true
locked = true

[tools]
actionlint = "1.7.12"
jq = "1.8.1"
shellcheck = "0.11.0"
