name: scaffold-haskell

# Renders the scaffold-haskell template into a sample project and runs the project's
# scripts/check. A red run means a project made from the template today would start red.
on:
  pull_request:
    paths:
      - skills/scaffold/scaffold-haskell/**
      - .github/workflows/scaffold-haskell.yml
  push:
    branches: [main]
    paths:
      - skills/scaffold/scaffold-haskell/**
      - .github/workflows/scaffold-haskell.yml
  # The scaffold takes the newest hspec and QuickCheck from Hackage, so a new release can break
  # the template without a change here. A weekly run catches that.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-haskell-${{ github.ref }}
  cancel-in-progress: true

env:
  SKILL: skills/scaffold/scaffold-haskell
  SAMPLE: sample-tool

jobs:
  scaffold-haskell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The runner image sets GHCUP_INSTALL_BASE_PREFIX=/usr/local and preinstalls a GHC. Use our
      # own prefix, as the template's setup-haskell action does, so the image never decides.
      - run: echo "GHCUP_INSTALL_BASE_PREFIX=$RUNNER_TEMP/ghcup" >> "$GITHUB_ENV"

      # Only mise itself here. The scaffold installs the tools from the template's mise.lock.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8
          install: false

      # The scaffold pins this GHC; the template's mise.toml pins ghcup.
      - id: versions
        run: |
          echo "ghc=$(sed -n 's/^ghc_version=//p' "$SKILL/scripts/scaffold")" >> "$GITHUB_OUTPUT"
          echo "ghcup=$(sed -n 's/^ghcup = "\(.*\)"$/\1/p' "$SKILL/template/mise.toml.tmpl")" >> "$GITHUB_OUTPUT"

      - id: ghc-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GHCUP_INSTALL_BASE_PREFIX }}/.ghcup
          key: ghcup-${{ runner.os }}-${{ steps.versions.outputs.ghc }}-${{ steps.versions.outputs.ghcup }}

      - if: steps.ghc-cache.outputs.cache-hit != 'true'
        run: mise exec "ghcup@${{ steps.versions.outputs.ghcup }}" -- ghcup install ghc "${{ steps.versions.outputs.ghc }}"

      # The scaffold runs cabal update, installs the pinned tools and writes the freeze file.
      - name: Render the template
        run: |
          sh "$SKILL/scripts/scaffold" "$RUNNER_TEMP/$SAMPLE" "$SAMPLE" \
            "A sample project that tests the template" "a Go developer new to Haskell"
          git -C "$RUNNER_TEMP/$SAMPLE" add -A

      # The shipped mise.lock must be what `mise lock` writes for the shipped mise.toml.
      - name: The template's mise.lock is current
        working-directory: ${{ runner.temp }}/${{ env.SAMPLE }}
        run: |
          mise lock --platform linux-x64,macos-arm64
          git diff --exit-code mise.lock

      # actionlint checks GitHub workflow files and runs shellcheck on their scripts. A broken
      # workflow template would give every new project a red CI. shellcheck also covers the
      # scaffold and the project's own scripts and hooks. This step runs from the repository
      # root: the sample's mise.toml sets locked = true, and its mise.lock has no entry for these
      # two tools.
      - name: Lint the scaffold and the sample project's workflows and scripts
        run: |
          lint() { mise exec shellcheck@0.11.0 actionlint@1.7.12 -- "$@"; }
          sample=$RUNNER_TEMP/$SAMPLE
          lint actionlint "$sample"/.github/workflows/*.yml
          lint shellcheck "$sample"/scripts/* "$sample"/.githooks/* "$sample"/.claude/hooks/*
          lint shellcheck -x -P SCRIPTDIR "$SKILL/scripts/scaffold"

      # The cabal store holds the built dependencies, such as hspec. Restoring it saves most of
      # the build time. Ask cabal where the store is, since the runner image may set it up.
      - id: store
        working-directory: ${{ runner.temp }}/${{ env.SAMPLE }}
        run: echo "dir=$(mise exec -- cabal path --store-dir)" >> "$GITHUB_OUTPUT"

      # The scaffold resolves today's versions, so each run saves under its own key and
      # restores the newest one.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.dir }}
          key: cabal-store-${{ runner.os }}-${{ steps.versions.outputs.ghc }}-${{ github.run_id }}
          restore-keys: cabal-store-${{ runner.os }}-${{ steps.versions.outputs.ghc }}-

      - name: Run the sample project's checks
        run: |
          "$RUNNER_TEMP/$SAMPLE/scripts/check"
