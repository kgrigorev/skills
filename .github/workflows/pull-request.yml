name: pull-request

# Lints skills/pull-request/scripts and runs land-squash-stack against a stand-in GitHub.
on:
  pull_request:
    paths:
      - skills/pull-request/scripts/**
      - tests/pull-request/**
      - .github/workflows/pull-request.yml
  push:
    branches: [main]
    paths:
      - skills/pull-request/scripts/**
      - tests/pull-request/**
      - .github/workflows/pull-request.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  land-squash-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # ubuntu-24.04 ships shellcheck, jq, git and python3.
      - run: shellcheck -s sh skills/pull-request/scripts/land-squash-stack tests/pull-request/land-squash-stack
      - run: tests/pull-request/land-squash-stack
