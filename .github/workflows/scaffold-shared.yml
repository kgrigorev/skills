name: scaffold-shared

# Every scaffold-<stack> skill holds a copy of the files in skills/scaffold/_shared, because each
# skill installs on its own. This job fails when a copy differs from the source.
on:
  pull_request:
    paths:
      - skills/scaffold/**
      - scripts/sync-scaffold-shared
      - .github/workflows/scaffold-shared.yml
  push:
    branches: [main]
    paths:
      - skills/scaffold/**
      - scripts/sync-scaffold-shared
      - .github/workflows/scaffold-shared.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/sync-scaffold-shared --check
