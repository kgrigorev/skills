name: scaffold-c

# Renders the scaffold-c template into a sample project and runs the project's scripts/check,
# on Linux and macOS. A red run means a project made from the template today would start red.
# Projects run their own CI on Linux only, and people mostly run the check on macOS, so this job
# is where both are proven.
on:
  pull_request:
    paths:
      - skills/scaffold/scaffold-c/**
      - .github/workflows/scaffold-c.yml
      - tests/scaffold/c/**
      - scripts/test-scaffold
  push:
    branches: [main]
    paths:
      - skills/scaffold/scaffold-c/**
      - .github/workflows/scaffold-c.yml
      - tests/scaffold/c/**
      - scripts/test-scaffold
  # The scaffold writes mise.lock from conda-forge, and the runners change. A weekly run catches a
  # break that comes without a change here.
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-c-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these equal to min_version in template/mise.toml.tmpl and the latest actionlint and
  # shellcheck you lint with.
  MISE_VERSION: "2026.11.8"
  ACTIONLINT_VERSION: "1.7.12"
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  scaffold-c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Installs mise only. The scaffold installs the tools that the template's mise.toml pins.
      # The cache keeps them (about 1 GB unpacked for LLVM) and is saved after the job, so it
      # holds what the scaffold installed.
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache_save_post: true
          cache_key: scaffold-c-{{platform}}-${{ hashFiles('skills/scaffold/scaffold-c/template/mise.toml.tmpl') }}

      - name: Render the template
        run: |
          sh skills/scaffold/scaffold-c/scripts/scaffold "$RUNNER_TEMP/sample-tool" sample-tool \
            "A sample project that tests the template" "a Python developer new to C"

      # actionlint checks GitHub workflow files, and runs shellcheck on their scripts. A broken
      # workflow template would give every new project a red CI. shellcheck also reads the
      # sample project's shell scripts and the scaffold script.
      - name: Lint the sample project's workflows and scripts
        run: |
          sample=$RUNNER_TEMP/sample-tool
          mise exec "actionlint@$ACTIONLINT_VERSION" "shellcheck@$SHELLCHECK_VERSION" -- \
            actionlint "$sample"/.github/workflows/*.yml
          mise exec "shellcheck@$SHELLCHECK_VERSION" -- shellcheck -x \
            "$sample/scripts/check" "$sample/scripts/format" "$sample/.githooks/pre-push" \
            "$sample/.claude/hooks/check-on-stop.sh" skills/scaffold/scaffold-c/scripts/scaffold

      - name: Run the sample project's checks
        run: |
          "$RUNNER_TEMP/sample-tool/scripts/check"

      # Replays known ways to slip bad code past the gates (each must fail at its step) and good
      # code the gates must accept, on the project rendered above.
      - name: Replay the attacks on the sample project
        run: |
          scripts/test-scaffold c --project "$RUNNER_TEMP/sample-tool"
